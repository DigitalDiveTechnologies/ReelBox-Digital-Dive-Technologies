services:
  postgres:
    image: postgres:16-alpine
    container_name: srs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_reel_saver
    ports:
      - "5432:5432"
    volumes:
      - srs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_reel_saver"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: srs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.api
    container_name: srs-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Development Kestrel binds to 5080 (appsettings.Development.json); map host→container 5080.
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Database__ConnectionString: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
      Worker__UseInMemoryQueue: "false"
      ObjectStorage__Provider: Local
      ObjectStorage__LocalRootPath: storage-dev
      ObjectStorage__PublicApiBaseUrl: http://192.168.100.8:5080
      Jwt__SigningKey: DEV_ONLY_REPLACE_WITH_LONG_RANDOM_SECRET_KEY_64CHARS_MINIMUM_VALUE
      Providers__AccessToken: ${Providers__AccessToken:-}
    ports:
      - "5080:5080"
    volumes:
      - srs_storage:/app/storage-dev

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: srs-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Database__ConnectionString: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
      # Must match API: Development appsettings default to in-memory; Docker needs Redis.
      Worker__UseInMemoryQueue: "false"
      ObjectStorage__Provider: Local
      ObjectStorage__LocalRootPath: storage-dev
      Providers__Resolver: YtDlp
      Providers__YtDlpExecutablePath: yt-dlp
      Providers__TimeoutSeconds: "360"
      Providers__MaximumExecutionSeconds: "360"
      Providers__YtDlpTimeoutSeconds: "330"
      Providers__AccessToken: ${Providers__AccessToken:-}
    volumes:
      - srs_storage:/app/storage-dev

volumes:
  srs_pgdata:
  srs_storage:
