services:
  postgres:
    image: postgres:16-alpine
    container_name: srs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_reel_saver
    ports:
      - "5432:5432"
    volumes:
      - srs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_reel_saver"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: srs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    container_name: srs-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Database__ConnectionString: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379
    ports:
      - "5080:8080"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    container_name: srs-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Database__ConnectionString: Host=postgres;Port=5432;Database=social_reel_saver;Username=postgres;Password=postgres
      Redis__ConnectionString: redis:6379

volumes:
  srs_pgdata:
